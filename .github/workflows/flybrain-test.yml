name: FlyBrain Test

on:
  workflow_dispatch:
  push:
    paths:
      - "brain/**"
      - ".github/workflows/flybrain-test.yml"
      - "package.json"

jobs:
  test-flybrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FlyBot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone FlyBrain simulator
        run: |
          git clone --depth 1 \
            https://github.com/Tharusha101/flybrain.git \
            vendor/flybrain

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install scientific dependencies
        run: |
          python -m pip install \
            numpy \
            pandas \
            scipy \
            pyarrow \
            networkx \
            matplotlib \
            seaborn \
            tqdm \
            rich

      - name: Install PyTorch
        run: |
          python -m pip install torch

      - name: Check Python environment
        run: |
          python --version
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import pandas; print('Pandas:', pandas.__version__)"
          python -c "import scipy; print('SciPy:', scipy.__version__)"
          python -c "import torch; print('PyTorch:', torch.__version__)"

      - name: Test FlyBrain import
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/flybrain
        run: |
          python -c "import flybrain; print('FlyBrain import: OK')"

      - name: Test simulator modules
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/flybrain
        run: |
          python -c "from flybrain.simulator import Simulator; print('Simulator import: OK')"
          python -c "from flybrain.connectome import Connectome; print('Connectome import: OK')"

      - name: Check FlyBot bridge
        run: |
          python -m py_compile brain/flywire_bridge.py
          echo "flywire_bridge.py syntax: OK"

      - name: Final result
        run: |
          echo "======================================"
          echo " FlyBrain environment test completed"
          echo "======================================"
