name: FlyBrain + FlyBot Real Connectome

on:
  workflow_dispatch:
  push:
    paths:
      - "brain/**"
      - ".github/workflows/flybrain-test.yml"
      - "package.json"

env:
  FLYWIRE_RELEASE_REPO: DarkPlayz98/Flybot
  FLYWIRE_RELEASE_TAG: flywire-fafb-v783

jobs:
  flybrain-real-connectome:
    name: Download + Build + Simulate Real FlyWire Connectome
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout FlyBot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Clone FlyBrain
        run: |
          git clone --depth 1 \
            https://github.com/Tharusha101/flybrain.git \
            vendor/flybrain

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            pandas \
            scipy \
            pyarrow \
            networkx \
            matplotlib \
            seaborn \
            tqdm \
            rich
          python -m pip install torch

      - name: Show environment
        run: |
          echo "======================================"
          echo " FlyBot / FlyBrain Environment"
          echo "======================================"
          python --version
          echo "Architecture: $(uname -m)"
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import pandas; print('Pandas:', pandas.__version__)"
          python -c "import scipy; print('SciPy:', scipy.__version__)"
          python -c "import pyarrow; print('PyArrow:', pyarrow.__version__)"
          python -c "import torch; print('PyTorch:', torch.__version__)"
          python -c "import torch; print('CUDA:', torch.cuda.is_available())"

      - name: Test FlyBrain package
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/flybrain
        run: |
          python -c "import flybrain; print('FlyBrain import: OK')"
          python -c "from flybrain.simulator import Simulator; print('Simulator import: OK')"

      - name: Download FlyWire data from GitHub Release
        working-directory: vendor/flybrain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p data

          echo "=============================================="
          echo " Downloading FlyWire FAFB data from Release"
          echo "=============================================="
          echo "Repository: $FLYWIRE_RELEASE_REPO"
          echo "Release:    $FLYWIRE_RELEASE_TAG"
          echo ""

          gh release view "$FLYWIRE_RELEASE_TAG" \
            --repo "$FLYWIRE_RELEASE_REPO" \
            --json tagName,name,assets

          # GitHub's web uploader renamed the uploaded .csv.gz files to
          # .csv.gz.csv. Download those actual release asset names, then
          # restore the filenames expected by FlyBrain.
          echo "Downloading release assets with the uploader-added .csv suffix..."
          gh release download "$FLYWIRE_RELEASE_TAG" \
            --repo "$FLYWIRE_RELEASE_REPO" \
            --pattern "*.csv.gz.csv" \
            --dir data \
            --clobber

          required=(
            "neurons.csv.gz"
            "classification.csv.gz"
            "consolidated_cell_types.csv.gz"
            "connections_princeton.csv.gz"
          )

          echo ""
          echo "Normalizing release asset filenames..."
          for file in "${required[@]}"; do
            uploaded="data/${file}.csv"
            target="data/$file"

            if [ ! -s "$uploaded" ]; then
              echo "ERROR: Missing release asset $uploaded"
              echo "Expected release asset: ${file}.csv"
              exit 1
            fi

            mv -f "$uploaded" "$target"
            echo "Renamed: $(basename "$uploaded") -> $(basename "$target")"
          done

          echo ""
          echo "Validating gzip files..."
          for file in "${required[@]}"; do
            if [ ! -s "data/$file" ]; then
              echo "ERROR: Missing normalized file data/$file"
              exit 1
            fi
            gzip -t "data/$file"
            echo "Verified: data/$file ($(du -h "data/$file" | cut -f1))"
          done

          echo ""
          echo "All required FlyWire source files are available."
          ls -lh data/*.csv.gz

      - name: Verify FlyWire data schema
        working-directory: vendor/flybrain
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/flybrain
        run: |
          python scripts/inspect_data.py

      - name: Build sparse real connectome
        working-directory: vendor/flybrain
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/flybrain
        run: |
          python scripts/build_graph.py

          echo ""
          echo "======================================"
          echo " Built Connectome Cache"
          echo "======================================"
          find outputs/connectome -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Run real sugar-to-proboscis simulation
        working-directory: vendor/flybrain
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/flybrain
        run: |
          echo "======================================"
          echo " REAL FLYWIRE LIF SIMULATION"
          echo "======================================"
          python scripts/simulate_taste.py

      - name: Verify FlyBot bridge
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/flybrain
        run: |
          python -m py_compile brain/flywire_bridge.py
          echo "flywire_bridge.py syntax: OK"

      - name: Upload real simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-real-results
          path: |
            vendor/flybrain/outputs/**
            vendor/flybrain/assets/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Final report
        if: always()
        run: |
          echo ""
          echo "=============================================="
          echo "       FLYBOT REAL CONNECTOME TEST"
          echo "=============================================="
          echo ""
          echo "Data source: GitHub Release $FLYWIRE_RELEASE_TAG"
          echo "Repository:  $FLYWIRE_RELEASE_REPO"
          echo ""
          echo "Pipeline:"
          echo "  1. FlyWire FAFB source files from release assets"
          echo "  2. Data schema verification"
          echo "  3. Sparse 139k-neuron connectome build"
          echo "  4. LIF neural simulation"
          echo "  5. Sugar -> proboscis motor readout"
          echo "  6. FlyBot bridge verification"
          echo ""
          echo "The source CSV files are NOT committed to git."
          echo "They are consumed as release assets at runtime."
          echo ""
          echo "=============================================="
