name: FlyBrain + FlyBot Real Connectome

on:
  workflow_dispatch:
  push:
    paths:
      - "brain/**"
      - ".github/workflows/flybrain-test.yml"
      - "package.json"

jobs:
  flybrain-real-connectome:
    name: Download + Build + Simulate Real FlyWire Connectome
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout FlyBot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Clone FlyBrain
        run: |
          git clone --depth 1 \
            https://github.com/Tharusha101/flybrain.git \
            vendor/flybrain

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            pandas \
            scipy \
            pyarrow \
            networkx \
            matplotlib \
            seaborn \
            tqdm \
            rich
          python -m pip install torch

      - name: Show environment
        run: |
          echo "======================================"
          echo " FlyBot / FlyBrain Environment"
          echo "======================================"
          python --version
          echo "Architecture: $(uname -m)"
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import pandas; print('Pandas:', pandas.__version__)"
          python -c "import scipy; print('SciPy:', scipy.__version__)"
          python -c "import pyarrow; print('PyArrow:', pyarrow.__version__)"
          python -c "import torch; print('PyTorch:', torch.__version__)"
          python -c "import torch; print('CUDA:', torch.cuda.is_available())"

      - name: Test FlyBrain package
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/flybrain
        run: |
          python -c "import flybrain; print('FlyBrain import: OK')"
          python -c "from flybrain.simulator import Simulator; print('Simulator import: OK')"

      - name: Download real FlyWire FAFB v783 data
        working-directory: vendor/flybrain
        run: |
          set -euo pipefail

          mkdir -p data

          BASE="https://codex.flywire.ai/api/download_resource"
          DATASET="fafb"

          download() {
            PRODUCT="$1"
            FILE="$2"
            echo ""
            echo "Downloading $FILE from Codex product: $PRODUCT"
            curl --fail --location --retry 4 --retry-delay 5 \
              --connect-timeout 30 --max-time 1200 \
              -A "FlyBot-FlyWire-Research/1.0" \
              "${BASE}?data_product=${PRODUCT}&dataset=${DATASET}" \
              -o "data/${FILE}"
            gzip -t "data/${FILE}"
            ls -lh "data/${FILE}"
          }

          download "neurons" "neurons.csv.gz"
          download "classification" "classification.csv.gz"
          download "consolidated_cell_types" "consolidated_cell_types.csv.gz"
          download "connections_princeton" "connections_princeton.csv.gz"

          echo ""
          echo "Real FlyWire source files downloaded successfully."
          ls -lh data/*.csv.gz

      - name: Verify FlyWire data schema
        working-directory: vendor/flybrain
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/flybrain
        run: |
          python scripts/inspect_data.py

      - name: Build sparse real connectome
        working-directory: vendor/flybrain
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/flybrain
        run: |
          python scripts/build_graph.py

          echo ""
          echo "======================================"
          echo " Built Connectome Cache"
          echo "======================================"
          find outputs/connectome -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Run real sugar-to-proboscis simulation
        working-directory: vendor/flybrain
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/flybrain
        run: |
          echo "======================================"
          echo " REAL FLYWIRE LIF SIMULATION"
          echo "======================================"
          python scripts/simulate_taste.py

      - name: Verify FlyBot bridge
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/flybrain
        run: |
          python -m py_compile brain/flywire_bridge.py
          echo "flywire_bridge.py syntax: OK"

      - name: Upload real simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-real-results
          path: |
            vendor/flybrain/outputs/**
            vendor/flybrain/assets/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Final report
        if: always()
        run: |
          echo ""
          echo "=============================================="
          echo "       FLYBOT REAL CONNECTOME TEST"
          echo "=============================================="
          echo ""
          echo "This workflow attempted the actual public FlyWire FAFB dataset."
          echo "It is NOT a synthetic brain test."
          echo ""
          echo "Pipeline:"
          echo "  1. FlyWire CSV download"
          echo "  2. Data schema verification"
          echo "  3. Sparse 139k-neuron connectome build"
          echo "  4. LIF neural simulation"
          echo "  5. Sugar -> proboscis motor readout"
          echo "  6. FlyBot bridge verification"
          echo ""
          echo "If the run passed, the next step is connecting the"
          echo "simulated motor output to the live FlyBot Discord bot."
          echo ""
          echo "=============================================="
