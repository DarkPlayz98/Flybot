name: FlyBrain Test

on:
  workflow_dispatch:
  push:
    paths:
      - "brain/**"
      - ".github/workflows/flybrain-test.yml"
      - "package.json"

jobs:
  test-flybrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FlyBot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone FlyBrain
        run: |
          git clone --depth 1 \
            https://github.com/Tharusha101/flybrain.git \
            vendor/flybrain

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            pandas \
            scipy \
            pyarrow \
            networkx \
            matplotlib \
            seaborn \
            tqdm \
            rich
          python -m pip install torch

      - name: Check packages
        run: |
          python --version
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import pandas; print('Pandas:', pandas.__version__)"
          python -c "import scipy; print('SciPy:', scipy.__version__)"
          python -c "import torch; print('PyTorch:', torch.__version__)"

      - name: FlyBrain import
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/flybrain
        run: |
          python -c "import flybrain; print('FlyBrain import: OK')"
          python -c "from flybrain.simulator import Simulator; print('Simulator import: OK')"

      - name: Inspect FlyBrain modules
        run: |
          echo "=== flybrain directory ==="
          find vendor/flybrain/flybrain -maxdepth 2 -type f | sort

          echo ""
          echo "=== Python classes/modules containing Connectome ==="
          grep -R "class Connectome\|Connectome" \
            -n vendor/flybrain/flybrain \
            --include="*.py" | head -100 || true

      - name: Test FlyBot bridge syntax
        run: |
          python -m py_compile brain/flywire_bridge.py
          echo "flywire_bridge.py syntax: OK"
